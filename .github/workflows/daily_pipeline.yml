# ============================================================
# GITHUB ACTIONS WORKFLOW - Daily Crypto Pipeline
# Runs automatically every day at 8am UTC
# 1. Runs the Python extract & load script
# 2. Then triggers dbt to run the transformation model
# ============================================================

name: Daily Crypto Pipeline

on:
  # Run every day at 8am UTC (4pm Malaysia time)
  schedule:
    - cron: '0 8 * * *'
  
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repo code onto the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install the required Python libraries
      - name: Install dependencies
        run: pip install requests snowflake-connector-python

      # Step 4: Run the extract & load script
      # Credentials come from GitHub Secrets we set up earlier
      - name: Run extract and load
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: python pipeline/extract_load.py
